<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockroom — Serial & Warranty Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0F3; --panel:#FFFFFF; --panel-2:#F6F7F9; --inset:#EFF1F4;
    --sidebar:#1B2530; --sidebar-ink:#AEB9C6; --sidebar-strong:#FFFFFF;
    --sidebar-active:rgba(120,150,235,0.18); --sidebar-hover:rgba(255,255,255,0.06);
    --ink:#1A2028; --ink-soft:#586372; --ink-faint:#8A94A2;
    --line:#E2E6EB; --line-strong:#CBD2DB;
    --accent:#2B50C8; --accent-hover:#2444AC; --accent-soft:#E8ECFB; --accent-ink:#1E3A94;
    --ok:#0F8A4F; --ok-bg:#E3F4EA; --ok-ink:#0A6B3D;
    --sold:#5B6674; --sold-bg:#ECEFF2; --sold-ink:#3E4650;
    --warn:#B45309; --warn-bg:#FAEEDC; --warn-ink:#8A3F07;
    --err:#DC2626; --err-bg:#FBE7E7; --err-ink:#A81E1E;
    --shadow:0 1px 2px rgba(20,30,45,.06), 0 8px 24px rgba(20,30,45,.06);
    --r:10px; --r-sm:7px; --r-lg:14px;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  .layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100%}
  /* The mobile-menu backdrop must never take part in the desktop grid —
     otherwise it occupies the content column and pushes .main off-screen. */
  .scrim{display:none}

  /* Sidebar */
  .sidebar{background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;color:var(--sidebar-strong);font-weight:700;font-size:16px;letter-spacing:.2px}
  .brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3C63E6,#2B50C8);display:grid;place-items:center;font-size:14px}
  .nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);color:var(--sidebar-ink);font-weight:500;cursor:pointer}
  .nav a:hover{background:var(--sidebar-hover);color:#fff}
  .nav a.active{background:var(--sidebar-active);color:#fff}
  .nav a .i{width:17px;text-align:center;opacity:.9}
  .side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:var(--ink-faint)}
  .side-foot b{color:var(--sidebar-ink);display:block;font-weight:600}

  /* Main */
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 16px;padding:16px 26px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:40}
  #pageActions{display:flex;flex-wrap:wrap;gap:8px}
  .topbar h1{font-size:18px;margin:0;font-weight:600}
  .topbar .sub{color:var(--ink-faint);font-size:12.5px;margin-top:1px}
  .view{padding:22px 26px 60px;max-width:1400px;width:100%}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);padding:8px 13px;border-radius:var(--r-sm);font-weight:600;font-size:13px;cursor:pointer;transition:.12s}
  .btn:hover{background:var(--panel-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-hover)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft)}
  .btn.ghost:hover{background:var(--inset)}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn.danger{color:var(--err-ink);border-color:#F0C9C9}
  .btn.danger:hover{background:var(--err-bg)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* Cards + grid */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .kpi{padding:16px 18px}
  .kpi .label{color:var(--ink-faint);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .kpi .value{font-size:30px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi .value.mono{font-family:var(--mono)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:22px}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .panel-h h2{font-size:14.5px;margin:0;font-weight:600}
  .panel-b{padding:16px 18px}
  /* Flush panels hold tables: scroll them sideways instead of overflowing the page. */
  .panel-b.flush{padding:0;overflow-x:auto;border-radius:0 0 var(--r) var(--r)}

  /* Table */
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600;background:var(--panel-2)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel-2)}
  td.mono,.mono{font-family:var(--mono)}
  td.mono{white-space:nowrap}
  .muted{color:var(--ink-faint)}

  /* Serial pair motif */
  /* Wrap between the two serials when space is tight, never inside one. */
  .pair{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-family:var(--mono);font-size:12.5px}
  .pair .seg{padding:3px 8px;border-radius:6px;background:var(--inset);border:1px solid var(--line);white-space:nowrap}
  .pair .seg.int{background:var(--accent-soft);border-color:#D4DBF6;color:var(--accent-ink)}
  .pair .arrow{color:var(--ink-faint)}
  .pair .seg.empty{color:var(--ink-faint);font-style:italic;font-family:var(--sans)}

  /* Status chips */
  .chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
  .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .chip.in_stock{background:var(--ok-bg);color:var(--ok-ink)}
  .chip.sold{background:var(--sold-bg);color:var(--sold-ink)}
  .chip.returned{background:var(--warn-bg);color:var(--warn-ink)}
  .chip.defective{background:var(--err-bg);color:var(--err-ink)}

  /* Forms */
  label.field{display:block;margin-bottom:14px}
  label.field .lab{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
  input,select,textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:9px 11px;transition:.12s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;min-height:78px;font-family:var(--mono);font-size:13px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .hint{color:var(--ink-faint);font-size:12px;margin-top:4px}
  .seg-toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
  .seg-toggle button{border:none;background:var(--panel);padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer}
  .seg-toggle button.on{background:var(--accent);color:#fff}

  /* Toolbar */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar .grow{flex:1;min-width:200px}
  .search{position:relative}
  .search input{padding-left:32px}
  .search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}

  /* Warranty certificate */
  .cert{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);background:var(--panel)}
  .cert-top{background:linear-gradient(135deg,#223049,#1B2530);color:#fff;padding:20px 22px}
  .cert-top .t{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
  .cert-top .n{font-size:20px;font-weight:700;margin-top:3px}
  .cert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line)}
  .cert-grid .c{background:var(--panel);padding:14px 18px}
  .cert-grid .c .k{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .cert-grid .c .v{font-size:15px;font-weight:600;margin-top:4px}
  .bar{height:8px;border-radius:999px;background:var(--inset);overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:999px}
  .bar.warn > i{background:var(--warn)} .bar.err > i{background:var(--err)}

  /* Segmented stock bar */
  .stackbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--inset)}
  .stackbar > span{display:block}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink-soft)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

  /* Empty */
  .empty{text-align:center;padding:46px 20px;color:var(--ink-faint)}
  .empty .big{font-size:30px;margin-bottom:8px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(18,24,34,.46);display:grid;place-items:center;padding:20px;z-index:50}
  .modal{background:var(--panel);border-radius:var(--r-lg);box-shadow:0 20px 60px rgba(10,16,28,.3);width:100%;max-width:560px;max-height:90vh;overflow:auto}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal-h h3{margin:0;font-size:16px}
  .modal-b{padding:18px 20px}
  .modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel-2)}

  /* Toast */
  #toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:80}
  .toast{background:#1B2530;color:#fff;padding:11px 15px;border-radius:var(--r-sm);box-shadow:var(--shadow);font-size:13px;max-width:360px;animation:slin .2s ease}
  .toast.ok{background:#0F8A4F} .toast.err{background:#C32A2A}
  @keyframes slin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

  .preview-line{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .preview-line:last-child{border-bottom:none}
  /* Editable internal serial in the intake preview */
  .preview-line input.int-edit{width:220px;max-width:100%;padding:3px 8px;font-family:var(--mono);font-size:12.5px;background:var(--accent-soft);border-color:#D4DBF6;color:var(--accent-ink)}
  .preview-line input.int-edit.edited{border-color:var(--accent)}
  .preview-line input.mfr-edit{width:220px;max-width:100%;padding:3px 8px;font-family:var(--mono);font-size:12.5px;background:var(--inset)}
  .banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r-sm);font-size:13px;margin-bottom:16px}
  .banner.err{background:var(--err-bg);color:var(--err-ink)}
  .banner.info{background:var(--accent-soft);color:var(--accent-ink)}

  /* Tablet / small laptop: side-by-side dashboard panels get too cramped. */
  /* Signed-in user box (sidebar footer) */
  .side-user{display:flex;align-items:center;gap:10px}
  .avatar{width:30px;height:30px;border-radius:50%;background:#2E3B4A;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
  .side-user .who{min-width:0;flex:1}
  .side-user .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-actions{display:flex;gap:6px;margin-top:10px}
  .side-actions .btn{flex:1;justify-content:center;background:transparent;border-color:rgba(255,255,255,.14);color:var(--sidebar-ink)}
  .side-actions .btn:hover{background:var(--sidebar-hover);color:#fff}
  .role{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .role.user{background:var(--sold-bg);color:var(--sold-ink)}

  /* Login screen */
  .auth{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,#1B2530 0%,#223049 55%,#EEF0F3 55%)}
  .auth-card{width:100%;max-width:380px;background:var(--panel);border-radius:var(--r-lg);box-shadow:0 20px 60px rgba(10,16,28,.25);padding:28px 26px}
  .auth-card .brand{color:var(--ink);padding:0 0 4px}
  .auth-card h2{margin:14px 0 4px;font-size:18px}
  .auth-card .btn.primary{width:100%;justify-content:center;padding:10px 13px;margin-top:4px}
  [hidden]{display:none !important}

  @media (max-width:1100px){
    .row{grid-template-columns:1fr}
  }

  @media (max-width:860px){
    .layout{grid-template-columns:minmax(0,1fr)}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;transform:translateX(-100%);transition:.2s;z-index:60}
    .sidebar.open{transform:none}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
    .scrim.on{display:block}
    .menu-btn{display:inline-flex}
    .topbar{padding:12px 16px}
    .view{padding:18px 16px 60px}
    .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .kpi .value{font-size:24px}
    th,td{padding:10px 12px}
    #toast{left:16px;right:16px}
    .toast{max-width:none}
  }
  @media (min-width:861px){ .menu-btn{display:none} }
</style>
</head>
<body>
  <!-- Shown instead of the app until the user signs in. -->
  <div class="auth" id="auth" hidden>
    <form class="auth-card" id="loginForm" novalidate>
      <div class="brand"><span class="mark" style="color:#fff">▣</span> Stockroom</div>
      <h2>Sign in</h2>
      <p class="muted" style="margin:0 0 18px">Accounts are created by an administrator.</p>
      <div class="banner err" id="loginErr" hidden></div>
      <label class="field"><span class="lab">Username</span>
        <input id="loginUser" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label class="field"><span class="lab">Password</span>
        <input id="loginPass" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" id="loginBtn" type="submit">Sign in</button>
    </form>
  </div>

  <div class="layout" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="mark">▣</span> Stockroom</div>
      <nav class="nav" id="nav">
        <a data-route="dashboard"><span class="i">◧</span> Dashboard</a>
        <a data-route="products"><span class="i">▤</span> Products</a>
        <a data-route="intake"><span class="i">＋</span> Add stock</a>
        <a data-route="inventory"><span class="i">▦</span> Inventory</a>
        <a data-route="warranty"><span class="i">◎</span> Warranty lookup</a>
        <a data-route="users" data-admin hidden><span class="i">◉</span> Users</a>
        <a data-route="settings" data-admin hidden><span class="i">⚙</span> Settings</a>
      </nav>
      <div class="side-foot">
        <div class="side-user">
          <div class="avatar" id="me-avatar">?</div>
          <div class="who"><b id="me-name">—</b><span class="role" id="me-role"></span></div>
        </div>
        <div class="side-actions">
          <button class="btn sm" id="pwBtn">Password</button>
          <button class="btn sm" id="logoutBtn">Sign out</button>
        </div>
        <div style="margin-top:10px"><b id="foot-company">Stockroom</b> serial &amp; warranty tracking</div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn ghost sm menu-btn" id="menuBtn">☰</button>
          <div>
            <h1 id="pageTitle">Dashboard</h1>
            <div class="sub" id="pageSub"></div>
          </div>
        </div>
        <div id="pageActions"></div>
      </header>
      <div class="view" id="view"></div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="modal-root"></div>
  <script src="/app.js"></script>
</body>
</html>
